<style>
  :root {
    --bg: #f3f4f5; --panel: #ffffff; --panel-2: #eceef0; --ink: #1a1c1e; --muted: #5c636a; --faint: #8b9298;
    --line: #d5dadd; --accent: #1a1c1e; --accent-soft: #fff4cc; --mark: #F5C221;
    --lane-robot: #e2b31a; --lane-grip: #3a3d40; --lane-vision: #1f8a84; --lane-io: #8a8f94;
    --bad: #c8312b; --bad-soft: #fbe5e3; --good: #2a8a3e;
    --scene-top: #f7f8f8; --scene-bottom: #d9dde0;
    --shadow: 0 1px 2px rgba(20,22,24,0.08), 0 2px 8px rgba(20,22,24,0.05);
    --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121314; --panel: #1b1d1f; --panel-2: #242628; --ink: #eceeee; --muted: #b4b8bc; --faint: #8b9196;
      --line: #34383c; --accent: #f2f3f4; --accent-soft: #3a3420; --mark: #F5C221;
      --lane-robot: #f0cc4a; --lane-grip: #c5c8cc; --lane-vision: #5dcec6; --lane-io: #9aa0a6;
      --bad: #ff7b72; --bad-soft: #43201e; --good: #6fd286;
      --scene-top: #2a2d30; --scene-bottom: #101112;
      --shadow: 0 1px 2px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121314; --panel: #1b1d1f; --panel-2: #242628; --ink: #eceeee; --muted: #b4b8bc; --faint: #8b9196;
    --line: #34383c; --accent: #f2f3f4; --accent-soft: #3a3420; --mark: #F5C221;
    --lane-robot: #f0cc4a; --lane-grip: #c5c8cc; --lane-vision: #5dcec6; --lane-io: #9aa0a6;
    --bad: #ff7b72; --bad-soft: #43201e; --good: #6fd286;
    --scene-top: #2a2d30; --scene-bottom: #101112;
    --shadow: 0 1px 2px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--ui);
    -webkit-font-smoothing: antialiased;
  }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  header {
    flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .mark { flex: none; width: 40px; height: 40px; border-radius: 8px; background: var(--mark); display: grid; place-items: center; color: #1a1c1e; font: 700 13px var(--display); letter-spacing: 0.02em; }
  .title { min-width: 0; line-height: 1.1; }
  .title small { display: block; font: 600 11px var(--ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .title h1 { margin: 0; font: 700 22px var(--display); letter-spacing: 0.01em; }
  .mode-switch { margin-left: auto; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
  .mode-switch button { border: 0; background: none; cursor: pointer; padding: 6px 16px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .mode-switch button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .app { position: relative; flex: 1; min-height: 0; display: flex; }
  .rail { flex: none; width: 76px; display: flex; flex-direction: column; gap: 2px; padding: 8px 6px; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  .rail-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; border: 0; border-radius: 10px; background: none; cursor: pointer; color: var(--muted); font-size: 10.5px; font-weight: 500; }
  .rail-item:hover { background: var(--panel-2); color: var(--ink); }
  .rail-item[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .drawer { flex: none; width: 360px; display: flex; flex-direction: column; gap: 10px; padding: 10px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel-2); }
  .drawer[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
  .card[hidden] { display: none; }
  .card h2 { margin: 0 0 8px; font: 600 12px var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .card p { margin: 0; color: var(--muted); font-size: 13px; }
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); }
  .viewport { position: relative; flex: 1; min-height: 0; }
  .viewport canvas.main { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay { position: absolute; }
  .glass { background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 11px; }
  .toolbar { top: 12px; right: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .views { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px; padding: 4px; max-width: 420px; }
  .views button { border: 0; background: none; cursor: pointer; padding: 5px 9px; border-radius: 7px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .views button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .transport { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--panel-2); }
  .play { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; }
  .play svg { width: 18px; height: 18px; }
  .timeline { flex: 1; min-width: 0; position: relative; height: 54px; cursor: pointer; touch-action: none; }
  .timeline canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--mark); pointer-events: none; }
  .clock { flex: none; font-size: 13px; color: var(--muted); min-width: 96px; text-align: right; }
  .clock b { color: var(--ink); font-weight: 500; }
  .chips { flex: none; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
  .chips button { border: 0; background: none; cursor: pointer; padding: 4px 8px; border-radius: 6px; font-size: 12px; color: var(--muted); }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .toggle { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--mark); margin: 0; }
</style>

<body>
<header>
  <div class="mark" aria-hidden="true">F</div>
  <div class="title">
    <small>Educational cell</small>
    <h1>FANUC Educational Cell · LR Mate 200iD/4S</h1>
  </div>
  <div class="mode-switch" role="group" aria-label="Mode">
    <button type="button" data-mode="program" aria-pressed="true">Program</button>
    <button type="button" data-mode="manual" aria-pressed="false">Manual</button>

<div class="app">
  <nav class="rail" aria-label="Panels">
    <button type="button" class="rail-item" data-panel="live" aria-pressed="false">Live</button>
    <button type="button" class="rail-item" data-panel="program" aria-pressed="false">Program</button>
    <button type="button" class="rail-item" data-panel="io" aria-pressed="false">I/O</button>
    <button type="button" class="rail-item" data-panel="joints" aria-pressed="false">Joints</button>
    <button type="button" class="rail-item" data-panel="tcp" aria-pressed="false">TCP</button>
    <button type="button" class="rail-item" data-panel="report" aria-pressed="false">Report</button>

  <aside class="drawer" id="drawer" hidden>
    <section class="card" data-panel="live" hidden><h2>Live</h2><p id="live-body">Cycle state fills in with the program.</p></section>
    <section class="card" data-panel="program" hidden><h2>Program</h2><p>TP listing.</p></section>
    <section class="card" data-panel="io" hidden><h2>I/O</h2><p>DI, DO, RI, RO.</p></section>
    <section class="card" data-panel="joints" hidden><h2>Joints</h2><p>J1–J6.</p></section>
    <section class="card" data-panel="tcp" hidden><h2>TCP</h2><p>UF0 and UF1.</p></section>
    <section class="card" data-panel="report" hidden><h2>Report</h2><p>Cycle and clearance.</p></section>
    <section class="card" data-panel="jog" hidden><h2>Jog</h2><p>Joint and cartesian jog.</p></section>
  </aside>
  <main class="stage">
    <div class="viewport" id="viewport">
      <div class="overlay toolbar">
        <div class="views glass" role="group" aria-label="Views">
          <button type="button" data-view="iso" aria-pressed="true">Iso</button>
          <button type="button" data-view="front">Front</button>
          <button type="button" data-view="side">Side</button>
          <button type="button" data-view="top">Top</button>
          <button type="button" data-view="robot">Robot</button>
          <button type="button" data-view="board">Board</button>
          <button type="button" data-view="camera">Camera</button>
        </div>
      </div>
    </div>
    <div class="transport">
      <button type="button" class="play" id="play" aria-label="Pause"><svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5h3.5v15H7zM13.5 4.5H17v15h-3.5z"/></svg></button>
      <div class="timeline" id="timeline" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100">
        <canvas id="lanes"></canvas>
        <div class="playhead" id="playhead"></div>
      </div>
      <div class="clock mono"><b id="clock-now">0.0</b> / <span id="clock-end">0.0</span> s</div>
      <div class="chips" role="group" aria-label="Speed">
        <button type="button" data-speed="0.5">0.5×</button>
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" data-speed="2">2×</button>
      </div>
      <label class="toggle"><input type="checkbox" id="loop" checked> Loop</label>
      <label class="toggle"><input type="checkbox" id="trail" checked> Path</label>
      <label class="toggle"><input type="checkbox" id="guards" checked> Guards</label>
      <label class="toggle"><input type="checkbox" id="hq" checked> HQ</label>
    </div>
  </main>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import * as BufferGeometryUtils from "three/addons/utils/BufferGeometryUtils.js";

const $ = (id) => document.getElementById(id);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// @@logic-start — T0 stub. C1 replaces timing, the TP program, IK and collisions.
// Keep BOARD, boardHoles() and HOLES: the Solitaire mesh reads them.
// Board frame: origin at the board centre, +x right, +y back. UF1 origin is the front-left corner.
// A is the left triangle (base outward), B the right triangle mirrored. Rows 4-3-2-1. [E]

const BOARD = {
  x: -0.10, y: -0.08,
  w: 0.260, d: 0.160, h: 0.020, topZ: 0.020,
  holeR: 0.0105, holeD: 0.012,
  pitch: 0.034, row: 0.0294, tri: 0.065,
  cylR: 0.010, cylH: 0.032, chamfer: 0.001,
};

function boardHoles() {
  const rows = [4, 3, 2, 1];
  const holes = [];
  const count = { A: 0, B: 0 };
  for (const sign of [-1, 1]) {
    const side = sign < 0 ? "A" : "B";
    const cx = sign * BOARD.tri;
    rows.forEach((n, r) => {
      const x = cx - sign * (r - 1.5) * BOARD.row;
      for (let c = 0; c < n; c++) {
        const y = (c - (n - 1) / 2) * BOARD.pitch;
        count[side] += 1;
        holes.push({
          id: side + count[side], side, i: count[side], row: r, col: c,
          lx: x, ly: y,
          x: BOARD.x + x, y: BOARD.y + y, z: BOARD.topZ,
          ux: x + BOARD.w / 2, uy: y + BOARD.d / 2,
          cz: BOARD.topZ - BOARD.holeD / 2 + BOARD.cylH / 2,
        });
      }
    });
  }
  return holes;
}

const HOLES = boardHoles();
const DURATION = 4;
const segs = {
  robot: [{ t0: 0, t1: DURATION, label: "HOME", cmd: "J PR[1:HOME] 100% FINE", line: 6 }],
  gripper: [{ t0: 0, t1: DURATION, label: "OPEN", cmd: "CALL GRIP_OPEN", line: 7 }],
  vision: [{ t0: 0, t1: DURATION, label: "IDLE", cmd: "", line: 0 }],
  io: [{ t0: 0, t1: DURATION, label: "DOOR_OK", cmd: "DI[1:DOOR_OK]=ON", line: 5 }],
};
const TP = [
  "1:  UFRAME_NUM=1 ;",
  "2:  UTOOL_NUM=1 ;",
  "3:  PAYLOAD[1] ;",
  "4:  DO[11:BUSY]=ON ;",
  "5:  WAIT DI[1:DOOR_OK]=ON ;",
  "6:J PR[1:HOME] 100% FINE ;",
];
const parts = HOLES.filter((h) => h.side === "A").map((h) => ({
  id: h.id, from: h.id, to: "B" + h.i,
  track: [{ t: 0, p: [h.x, h.y, h.cz] }, { t: DURATION, p: [h.x, h.y, h.cz] }],
}));
const S = { t: [0], q: [[0, 0, 0, 0, -90, 0]], tcp: [[0.2, 0.3, 0.4]] };
const minClear = { m: 0.051, at: 0 };

function robotPose(t) {
  return { q: [0, 0, 0, 0, -90, 0], grip: 0, seg: segs.robot[0], tcp: [0.2, 0.3, 0.4], t };
}
function ioAt() {
  return {
    DI: { "1:DOOR_OK": 1 },
    DO: { "11:BUSY": 0, "12:CYCLE_DONE": 0 },
    RI: { "1:CLOSED": 0, "2:OPENED": 1 },
    RO: { "1:CLOSE": 0, "2:OPEN": 1 },
  };
}
function lineAt() { return 6; }
function fk(q) {
  return { R: [[0, 0, 1], [0, -1, 0], [1, 0, 0]], p: [360, 0, 280], q };
}
function ik(pose, qPrev) {
  return { q: qPrev ? qPrev.slice() : [0, 0, 0, 0, -90, 0], cfg: "N U T" };
}
// @@logic-end
// ================================================================ scene
const viewport = $("viewport");
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.domElement.classList.add("main");
viewport.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.02, 30);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 0.35;
controls.maxDistance = 7;

// Lights live in scene space (y up). world is rotated -90° about x, as before.
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a837e, 0.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e8, 2.4);
sun.position.set(2.0, 3.4, 1.8);
sun.target.position.set(0, 0.3, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.radius = 4;
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.002;
Object.assign(sun.shadow.camera, { left: -1.7, right: 1.7, top: 1.7, bottom: -1.7, near: 0.5, far: 9 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0xdde6ff, 0.45);
fillL.position.set(-2.2, 1.6, -1.6);
scene.add(fillL);
const rimL = new THREE.DirectionalLight(0xffffff, 0.6);
rimL.position.set(-0.6, 2.4, 2.8);
scene.add(rimL);

const world = new THREE.Group();
world.rotation.x = -Math.PI / 2;
scene.add(world);

// Room environment (no external HDR). PMREM runs before renderer.render is wrapped.
const pmrem = new THREE.PMREMGenerator(renderer);
const room = new RoomEnvironment();
scene.environment = pmrem.fromScene(room, 0.04).texture;
pmrem.dispose();
const roomGeos = new Set(), roomMats = new Set();
room.traverse((o) => {
  if (o.geometry) roomGeos.add(o.geometry);
  const list = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
  list.forEach((m) => roomMats.add(m));
});
roomGeos.forEach((g) => g.dispose());
roomMats.forEach((m) => m.dispose());

function themeIsDark() {
  const t = document.documentElement.dataset.theme;
  if (t === "dark") return true;
  if (t === "light") return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function syncSceneTheme() {
  const bottom = css("--scene-bottom") || "#e4dfda";
  if (!scene.fog) scene.fog = new THREE.Fog(new THREE.Color(bottom), 7, 18);
  else scene.fog.color.set(bottom);
  scene.environmentIntensity = themeIsDark() ? 0.5 : 0.7;
}
syncSceneTheme();
window.addEventListener("themechange", syncSceneTheme);

// Composer: MSAA on the target (samples 4). Logical size is corrected just below —
// passing a pixel-sized target makes EffectComposer treat that size as CSS pixels.
function viewSize() {
  return { w: Math.max(1, viewport.clientWidth), h: Math.max(1, viewport.clientHeight) };
}
const view0 = viewSize();
const dpr0 = Math.min(devicePixelRatio || 1, 2);
renderer.setPixelRatio(dpr0);
renderer.setSize(view0.w, view0.h, false);
const composerTarget = new THREE.WebGLRenderTarget(Math.floor(view0.w * dpr0), Math.floor(view0.h * dpr0), {
  type: THREE.HalfFloatType,
  samples: 4,
});
const composer = new EffectComposer(renderer, composerTarget);
composer.setSize(view0.w, view0.h);
const gtao = new GTAOPass(scene, camera, view0.w, view0.h);
gtao.updateGtaoMaterial({ radius: 0.15, distanceExponent: 1.5, thickness: 1.5, scale: 1.0, samples: 12 });
gtao.blendIntensity = 0.85;
composer.addPass(new RenderPass(scene, camera));
composer.addPass(gtao);
composer.addPass(new OutputPass());

function fitComposer() {
  const { w, h } = viewSize();
  const dpr = renderer.getPixelRatio();
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
}
new ResizeObserver(fitComposer).observe(viewport);

function writeHqBox(on) {
  const box = document.getElementById("hq");
  if (box) box.checked = on;
  document.querySelectorAll("label.toggle").forEach((lab) => {
    if (lab.textContent.replace(/\s+/g, " ").trim() !== "HQ") return;
    const input = lab.querySelector("input");
    if (input) input.checked = on;
  });
}
let hq = true;
function shadowMapSize(px) {
  sun.shadow.mapSize.set(px, px);
  if (sun.shadow.map) {
    sun.shadow.map.dispose();
    sun.shadow.map = null;
  }
}
function setQuality(on) {
  hq = !!on;
  try { localStorage.setItem("fanuc-edu-hq", hq ? "1" : "0"); } catch (e) {}
  gtao.enabled = hq;
  shadowMapSize(hq ? 4096 : 2048);
  renderer.setPixelRatio(hq ? Math.min(devicePixelRatio || 1, 2) : 1);
  fitComposer();
  writeHqBox(hq);
  return hq;
}
function storedHq() {
  try {
    const v = localStorage.getItem("fanuc-edu-hq");
    if (v === "0" || v === "1") return v === "1";
  } catch (e) {}
  return null;
}
function autoHq() {
  if (matchMedia("(pointer: coarse)").matches) return false;
  if (viewport.clientWidth > 0 && viewport.clientWidth < 900) return false;
  return true;
}
setQuality(storedHq() !== null ? storedHq() : autoHq());
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t && t.id === "hq") setQuality(t.checked);
});

// frame() calls renderFrame(). Passes inside the composer call renderer.render directly.
